[package]
name = "hc-wfd"
description = "Holochain over Wi-Fi Direct: a Windows group owner shows a QR code, Ubuntu scans it and joins, and the two conductors exchange DHT entries with no router, internet or bootstrap server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "hc-wfd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes = "1"
clap = { version = "4", features = ["derive"] }
hcwfd-pairing = { path = "../pairing" }
hcwfd-wifi = { path = "../wifi-direct" }
holochain = "=0.7.0"
holochain_conductor_api = "=0.7.0"
holochain_trace = "=0.7.0"
holochain_types = "=0.7.0"
kitsune2_api = "0.5"
kitsune2_core = "0.5"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sodoken = "0.1"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url2 = "0.0.6"
# QR codes: generating them, and reading them from images.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
rqrr = { version = "0.11", default-features = false, features = ["img"] }
